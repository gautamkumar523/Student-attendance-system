<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- Nav is auto-injected by common.js -->
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard Overview</h1>
        <p class="page-subtitle" id="dashboard-greeting">Welcome!</p>
      </div>
      <span class="badge badge--primary">📊 Dashboard</span>
    </div>

    <!-- Stat Cards -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- Middle Row: Gauge (left) + Attendance Trend Graph (right) -->
    <div class="dashboard-grid">
      <!-- Left: Overall Attendance Gauge -->
      <div class="card gauge-card" id="gauge-card"></div>
      <!-- Right: Daily Attendance Trend Graph -->
      <div class="card" id="trend-chart-card"></div>
    </div>

    <!-- Full-width: Daily Student Attendance Table -->
    <div class="card" id="daily-attendance-card"></div>

    <!-- Activity Feed -->
    <div class="card">
      <div class="card__header"><h2 class="card__title">Recent Activity</h2></div>
      <ul class="activity-feed" id="activity-feed"></ul>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
