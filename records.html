<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Records — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Attendance Records</h1>
        <p class="page-subtitle">View and export attendance history</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card__header">
        <h2 class="card__title">Filters</h2>
        <span id="record-count" style="font-size:0.82rem;color:var(--clr-text-muted);"></span>
      </div>
      <div class="card__body">
        <div class="records-filters">
          <div class="form-group">
            <label for="filter-from">Date From</label>
            <input type="date" id="filter-from" />
          </div>
          <div class="form-group">
            <label for="filter-to">Date To</label>
            <input type="date" id="filter-to" />
          </div>
          <div class="form-group" style="flex:1;min-width:180px;">
            <label for="filter-student">Search Student</label>
            <input type="text" id="filter-student" placeholder="Name, roll no, or ID" />
          </div>
          <div class="form-group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Late">Late</option>
              <option value="Leave">Leave</option>
            </select>
          </div>
          <div class="form-group" style="display:flex;gap:8px;align-items:end;">
            <button type="button" class="btn btn--primary btn--small" id="btn-filter">🔍 Filter</button>
            <button type="button" class="btn btn--outline btn--small" id="btn-clear">Clear</button>
            <button type="button" class="btn btn--outline btn--small" id="btn-export">📥 Export CSV</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div id="summary-row" class="stats-grid"></div>

    <!-- Table -->
    <div class="card">
      <div class="card__header">
        <h2 class="card__title">Attendance History</h2>
      </div>
      <div class="table-wrapper">
        <table id="records-table">
          <thead>
            <tr>
              <th class="sortable" data-col="date" style="cursor:pointer;">Date <span class="sort-icon"></span></th>
              <th class="sortable" data-col="time" style="cursor:pointer;">Time <span class="sort-icon"></span></th>
              <th class="sortable" data-col="student" style="cursor:pointer;">Student <span class="sort-icon"></span></th>
              <th class="sortable" data-col="rollNo" style="cursor:pointer;">Roll No <span class="sort-icon"></span></th>
              <th class="sortable" data-col="status" style="cursor:pointer;">Status <span class="sort-icon"></span></th>
              <th class="sortable" data-col="remarks" style="cursor:pointer;">Remarks <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
