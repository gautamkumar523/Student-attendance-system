<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Student Directory</h1>
        <p class="page-subtitle">Manage all students in the system <span class="badge badge--primary" id="student-count">(0 students)</span></p>
      </div>
      <a href="add-student.html" class="btn btn--primary" id="btn-add-student">➕ Add Student</a>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <div class="card__body">
        <div class="filter-bar" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
            <label for="search-input" class="form-label">Search</label>
            <input type="text" id="search-input" placeholder="Search by name, roll no." autocomplete="off" aria-label="Search students" style="width: 100%;" />
          </div>
          <div class="form-group" style="min-width: 155px; margin-bottom: 0;">
            <label for="filter-course" class="form-label">Course</label>
            <select id="filter-course">
              <option value="">All Courses</option>
            </select>
          </div>
          <div class="form-group" style="min-width: 140px; margin-bottom: 0;">
            <label for="filter-year" class="form-label">Year</label>
            <select id="filter-year">
              <option value="">All Years</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">View</label>
            <div class="view-toggle">
              <button type="button" id="btn-table" class="view-toggle__btn active" title="Table view">☰ Table</button>
              <button type="button" id="btn-cards" class="view-toggle__btn" title="Cards view">▦ Cards</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">&nbsp;</label>
            <button type="button" id="btn-clear-filters" class="btn btn--outline" style="height: 41px;">Clear Filters</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="table-view">
        <div class="table-wrapper">
          <table id="students-table">
            <thead>
              <tr>
                <th class="sortable" data-sort="rollNo" title="Sort by Roll No">Roll No</th>
                <th class="sortable" data-sort="name" title="Sort by Name">Name</th>
                <th class="sortable" data-sort="course" title="Sort by Course">Course</th>
                <th class="sortable" data-sort="dept" title="Sort by Department">Dept</th>
                <th class="sortable" data-sort="pct" title="Sort by Attendance %">Attendance %</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="students-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="cards-view" style="display: none;">
        <div class="student-cards" id="cards-container"></div>
      </div>

      <div id="empty-state" class="table-empty" style="display: none;">
        <p class="empty-icon">👥</p>
        <p class="empty-title" id="empty-state-title">No students found</p>
        <p class="empty-desc" id="empty-state-desc">Try adjusting your search or filters.</p>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
