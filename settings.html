<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- Sidebar nav is auto-injected by common.js -->
  <div class="page">
    <h1 class="page-title">Settings</h1>

    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" class="tab-btn tab-btn--active" data-tab="tab-classes" role="tab">Classes</button>
        <button type="button" class="tab-btn" data-tab="tab-threshold" role="tab">Threshold</button>
      </div>

      <!-- Tab: Classes -->
      <div class="tab-panel tab-panel--active" id="tab-classes" role="tabpanel">
        <div class="filter-bar">
          <div class="form-group">
            <label for="cls-course">Course</label>
            <input type="text" id="cls-course" placeholder="e.g. B.Tech CS" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="cls-semester">Year</label>
            <input type="text" id="cls-semester" placeholder="e.g. 2nd Year" autocomplete="off" />
          </div>
          <button type="button" class="btn btn--primary" id="btn-add-cls">Add Class</button>
          <button type="button" class="btn btn--outline" id="btn-cancel-cls" style="display: none;">Cancel</button>
        </div>

        <div class="table-wrapper">
          <table id="classes-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Course</th>
                <th>Year</th>
                <th style="width: 170px;">Actions</th>
              </tr>
            </thead>
            <tbody id="classes-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Tab 4: Threshold -->
      <div class="tab-panel" id="tab-threshold" role="tabpanel">
        <div style="max-width: 440px; padding: 0.5rem 0;">
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="inp-threshold">Minimum Attendance Percentage</label>
            <input type="number" id="inp-threshold" min="0" max="100" />
            <p style="font-size: 0.85rem; color: var(--clr-text-muted); margin-top: 0.35rem;">
              Students below this percentage will be highlighted in red across the system.
            </p>
          </div>
          <button type="button" class="btn btn--primary" id="btn-save-threshold">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
