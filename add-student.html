<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Student — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="page-heading">Add New Student</h1>
        <p class="page-subtitle">Enter student details</p>
      </div>
    </div>

    <div class="card">
      <div class="accordion" id="student-accordion">

        <div class="accordion__item accordion__item--open" id="panel-basic">
          <div class="accordion__header">
            <h2 class="card__title">Personal Info</h2>
          </div>
          <div class="accordion__body">
            <div class="accordion__content">
              <div class="student-form-top" style="display: flex; gap: 2rem; align-items: flex-start;">
                <div class="form-group" style="flex: 0 0 auto;">
                  <label class="form-label">Profile Photo</label>
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <img src="assets/default-avatar.svg" alt="Profile Preview" class="photo-preview" id="photo-preview"
                         style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid var(--clr-border-strong); background: var(--clr-bg-alt);" />
                    <label for="inp-photo" class="btn btn--outline btn--small" style="cursor: pointer;">
                      📷 Choose Image
                    </label>
                    <input type="file" id="inp-photo" accept="image/*" style="display: none;" />
                  </div>
                </div>
                <div class="form-grid" style="flex: 1;">
                  <div class="form-group">
                    <label for="inp-id">Student ID / Roll Number <span class="required">*</span></label>
                    <input type="text" id="inp-id" placeholder="e.g. STU101" required />
                    <span class="error-text hidden" id="err-id"></span>
                  </div>
                  <div class="form-group">
                    <label for="inp-name">Full Name <span class="required">*</span></label>
                    <input type="text" id="inp-name" placeholder="e.g. Jane Doe" required />
                    <span class="error-text hidden" id="err-name"></span>
                  </div>
                  <div class="form-group">
                    <label for="inp-dob">Date of Birth</label>
                    <input type="date" id="inp-dob" />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Gender</label>
                    <div style="display: flex; gap: 16px; align-items: center; padding-top: 8px;">
                      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--clr-text); font-weight: normal;">
                        <input type="radio" name="gender" value="Male" style="accent-color: var(--clr-primary);" /> Male
                      </label>
                      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--clr-text); font-weight: normal;">
                        <input type="radio" name="gender" value="Female" style="accent-color: var(--clr-primary);" /> Female
                      </label>
                      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--clr-text); font-weight: normal;">
                        <input type="radio" name="gender" value="Other" style="accent-color: var(--clr-primary);" /> Other
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion__item" id="panel-academic">
          <div class="accordion__header">
            <h2 class="card__title">Academic Info</h2>
          </div>
          <div class="accordion__body">
            <div class="accordion__content">
              <div class="form-grid">
                <div class="form-group">
                  <label for="inp-course">Course / Class</label>
                  <select id="inp-course">
                    <option value="" disabled selected>— Select Course —</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="inp-semester">Year</label>
                  <select id="inp-semester">
                    <option value="" disabled selected>— Select Year —</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="inp-department">Department</label>
                  <input type="text" id="inp-department" placeholder="e.g. Computer Science & Engineering" />
                </div>
                <div class="form-group">
                  <label for="inp-batch">Batch / Session</label>
                  <input type="text" id="inp-batch" placeholder="e.g. 2024–2028" />
                </div>
                <div class="form-group">
                  <label for="inp-admission-no">Admission Number</label>
                  <input type="text" id="inp-admission-no" placeholder="e.g. ADM-2024-001" />
                </div>
                <div class="form-group">
                  <label for="inp-admission-date">Admission Date</label>
                  <input type="date" id="inp-admission-date" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion__item" id="panel-contact">
          <div class="accordion__header">
            <h2 class="card__title">Contact Info</h2>
          </div>
          <div class="accordion__body">
            <div class="accordion__content">
              <div class="form-grid">
                <div class="form-group">
                  <label for="inp-mobile">Mobile Number</label>
                  <input type="tel" id="inp-mobile" placeholder="e.g. +1 555 123 4567" />
                </div>
                <div class="form-group">
                  <label for="inp-email">Email</label>
                  <input type="email" id="inp-email" placeholder="e.g. student@example.com" />
                </div>
                <div class="form-group form-group--full">
                  <label for="inp-address">Address</label>
                  <textarea id="inp-address" rows="3" placeholder="Residential address"></textarea>
                </div>
                <div class="form-group">
                  <label for="inp-city">City</label>
                  <input type="text" id="inp-city" placeholder="e.g. Springfield" />
                </div>
                <div class="form-group">
                  <label for="inp-state">State</label>
                  <input type="text" id="inp-state" placeholder="e.g. Illinois" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion__item" id="panel-parent">
          <div class="accordion__header">
            <h2 class="card__title">Parent/Guardian Info</h2>
          </div>
          <div class="accordion__body">
            <div class="accordion__content">
              <div class="form-grid">
                <div class="form-group">
                  <label for="inp-father">Father's / Guardian's Name</label>
                  <input type="text" id="inp-father" placeholder="e.g. Robert Doe" />
                </div>
                <div class="form-group">
                  <label for="inp-mother">Mother's Name</label>
                  <input type="text" id="inp-mother" placeholder="e.g. Sarah Doe" />
                </div>
                <div class="form-group">
                  <label for="inp-parent-mobile">Parent/Guardian Mobile</label>
                  <input type="tel" id="inp-parent-mobile" placeholder="e.g. +1 555 987 6543" />
                </div>
                <div class="form-group">
                  <label for="inp-parent-email">Parent/Guardian Email</label>
                  <input type="email" id="inp-parent-email" placeholder="e.g. parent@example.com" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion__item" id="panel-review">
          <div class="accordion__header">
            <h2 class="card__title">Review &amp; Submit</h2>
          </div>
          <div class="accordion__body">
            <div class="accordion__content">
              <div id="review-summary"></div>
              <div class="btn-row">
                <button type="button" class="btn btn--success" id="save-btn">Save Student</button>
                <button type="button" class="btn btn--outline" id="reset-btn">Cancel</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/add-student.js"></script>
</body>
</html>
