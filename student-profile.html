<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">

    <!-- Error: Student Not Found (hidden by default) -->
    <div id="student-not-found" class="card hidden" style="margin-bottom:20px;">
      <div class="card__body" style="text-align:center;padding:40px 20px;">
        <div style="font-size:2.5rem;margin-bottom:12px;">🔍</div>
        <h2 class="card__title" id="error-title" style="margin-bottom:8px;">Student Not Found</h2>
        <p id="error-message" style="color:var(--clr-text-muted);margin-bottom:16px;">The student you are looking for does not exist or has been removed.</p>
        <a href="students.html" class="btn btn--primary">← Back to Directory</a>
      </div>
    </div>

    <!-- Profile Content -->
    <div id="student-profile-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Student Profile</h1>
        </div>
      </div>

      <!-- Profile Header Card -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card__body" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
          <img id="profile-photo" src="assets/default-avatar.svg" alt="Student Photo"
               style="width:72px;height:72px;border-radius:14px;object-fit:cover;border:2px solid var(--clr-border);flex-shrink:0;background:var(--clr-bg-alt);"
               onerror="this.src='assets/default-avatar.svg'" />
          <div style="flex:1;min-width:180px;">
            <h2 id="profile-name" style="font-size:1.25rem;font-weight:700;margin-bottom:2px;">—</h2>
            <p id="profile-id" style="font-size:0.85rem;color:var(--clr-text-muted);margin-bottom:4px;">Roll No: —</p>
            <p id="profile-course" style="font-size:0.85rem;color:var(--clr-text-muted);margin-bottom:6px;">—</p>
            <span class="badge" id="profile-pct">—</span>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <a href="#" class="btn btn--primary btn--small" id="btn-edit-profile">✏️ Edit Profile</a>
            <a href="students.html" class="btn btn--outline btn--small" id="btn-back-directory">← Back</a>
          </div>
        </div>
      </div>

      <!-- Tabs Card -->
      <div class="card">
        <div class="tabs" role="tablist" style="padding:0 20px;">
          <button class="tab-btn tab-btn--active" data-tab="tab-personal" type="button" role="tab">Overview</button>
          <button class="tab-btn" data-tab="tab-summary" type="button" role="tab">Attendance Stats</button>
          <button class="tab-btn" data-tab="tab-history" type="button" role="tab">Attendance History</button>
        </div>

        <!-- Overview Tab -->
        <div class="tab-panel tab-panel--active" id="tab-personal" role="tabpanel">
          <div class="card__body" id="personal-info-container"></div>
        </div>

        <!-- Attendance Stats Tab -->
        <div class="tab-panel" id="tab-summary" role="tabpanel">
          <div class="card__body">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--green">✓</div>
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-present">0</div>
                  <div class="stat-card__label">Present</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--red">✗</div>
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-absent">0</div>
                  <div class="stat-card__label">Absent</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--amber">⏱</div>
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-late">0</div>
                  <div class="stat-card__label">Late</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-card__icon stat-card__icon--blue">📋</div>
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-leave">0</div>
                  <div class="stat-card__label">Leave</div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-total">0</div>
                  <div class="stat-card__label">Total Classes</div>
                </div>
              </div>
              <div class="stat-card" id="stat-pct-card">
                <div class="stat-card__info">
                  <div class="stat-card__value" id="stat-pct">—</div>
                  <div class="stat-card__label">Overall %</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Attendance History Tab -->
        <div class="tab-panel" id="tab-history" role="tabpanel">
          <div class="card__body">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
              <h3 class="card__title">View Attendance By</h3>
              <div class="tabs" id="hist-view-toggle" style="border:none;margin:0;">
                <button type="button" class="tab-btn tab-btn--active" data-mode="day">📅 Day</button>
                <button type="button" class="tab-btn" data-mode="month">📆 Month</button>
                <button type="button" class="tab-btn" data-mode="total">📊 Total</button>
              </div>
            </div>

            <div id="hist-day-filter" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px;">
              <div class="form-group" style="margin-bottom:0;">
                <label for="hist-specific-date">Select Date</label>
                <input type="date" id="hist-specific-date" />
              </div>
              <button type="button" class="btn btn--primary btn--small" id="hist-filter-btn">Filter</button>
              <button type="button" class="btn btn--outline btn--small" id="hist-reset-btn">Reset</button>
            </div>

            <div id="hist-month-filter" class="hidden" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px;">
              <div class="form-group" style="margin-bottom:0;">
                <label for="hist-month-picker">Select Month</label>
                <input type="month" id="hist-month-picker" />
              </div>
              <button type="button" class="btn btn--primary btn--small" id="hist-month-filter-btn">Filter</button>
              <button type="button" class="btn btn--outline btn--small" id="hist-month-reset-btn">Reset</button>
            </div>

            <div id="hist-total-filter" class="hidden"></div>

            <div id="hist-summary" class="stats-grid" style="margin-bottom:16px;"></div>

            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Remarks</th>
                  </tr>
                </thead>
                <tbody id="hist-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/student-profile.js"></script>
</body>
</html>
