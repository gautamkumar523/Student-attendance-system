<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mark Attendance — AttendTrack</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <h1 class="page-title">Mark Attendance</h1>
        <p class="page-subtitle">Record daily student attendance</p>
      </div>
    </div>

    <!-- Config Warning -->
    <div id="config-warning" style="display:none;">
      <div class="card" style="border-color:var(--clr-warning);margin-bottom:20px;">
        <div class="card__body" style="display:flex;align-items:center;gap:12px;justify-content:space-between;">
          <div>
            <strong>⚠️ Setup Required:</strong>
            <span id="config-warning-text">Please configure classes in Settings before marking attendance.</span>
          </div>
          <a href="settings.html" class="btn btn--primary btn--small">Go to Settings →</a>
        </div>
      </div>
    </div>

    <!-- Session Controls -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card__header">
        <h2 class="card__title">Attendance Session</h2>
      </div>
      <div class="card__body">
        <div class="attendance-controls">
          <div class="form-group">
            <label for="att-date">Date <span style="color:var(--clr-danger);">*</span></label>
            <input type="date" id="att-date" />
          </div>
          <input type="hidden" id="attendance-time" />
          <div class="form-group" style="flex:1;min-width:220px;">
            <label for="att-class">Class <span style="color:var(--clr-danger);">*</span></label>
            <select id="att-class">
              <option value="">Select Class</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Student List & Attendance -->
    <div class="card" id="attendance-card">
      <div class="card__header">
        <div>
          <h2 class="card__title">Student List</h2>
          <div id="attendance-info-badge" style="font-size:0.78rem;color:var(--clr-text-muted);margin-top:4px;"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="bulk-actions-row">
          <button type="button" class="btn btn--primary btn--small" id="btn-all-present">✓ All Present</button>
          <button type="button" class="btn btn--danger btn--small" id="btn-all-absent">✗ All Absent</button>
          <button type="button" class="btn btn--outline btn--small" id="btn-all-late" style="color:var(--clr-warning);">⏱ All Late</button>
          <button type="button" class="btn btn--outline btn--small" id="btn-all-leave">📋 All Leave</button>
        </div>
      </div>

      <!-- Summary -->
      <div id="attendance-summary" style="display:flex;gap:16px;flex-wrap:wrap;padding:14px 22px;background:var(--clr-bg-alt);border-bottom:1px solid var(--clr-border);">
        <span class="status-pill status-pill--present" id="stat-present">PRESENT: 0</span>
        <span class="status-pill status-pill--absent" id="stat-absent">ABSENT: 0</span>
        <span class="status-pill status-pill--late" id="stat-late">LATE: 0</span>
        <span class="status-pill status-pill--leave" id="stat-leave">LEAVE: 0</span>
        <span style="margin-left:auto;font-size:0.85rem;color:var(--clr-text-secondary);" id="stat-total">Total: 0</span>
      </div>

      <!-- Table -->
      <div class="table-wrapper" id="table-wrapper">
        <table id="attendance-table">
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Status</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody id="attendance-body"></tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="table-empty" style="display:none;">
        <p id="empty-state-msg">Select a class to view students</p>
        <div id="empty-state-actions"></div>
      </div>

      <!-- Save -->
      <div style="padding:16px 22px;border-top:1px solid var(--clr-border);" id="save-row">
        <button type="button" class="btn btn--primary" id="btn-save" style="width:100%;">
          💾 Save Attendance
        </button>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
